[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miPyRNA"
version = "1.0.0"
dynamic = ["dependencies"]
description = "miPyRNA: end-to-end Python toolkit for small RNA-seq analysis in plants and animals"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Naveen Duhan", email = "naveen.duhan@usu.edu"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Unix",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/navduhan/mipyrna"

[project.scripts]
mipyrna = "mipyrna.cli:main"

[tool.setuptools.packages.find]
include = ["mipyrna*"]
exclude = ["tests*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
mipyrna = ["param/*.ini", "data/*", "data/models/SHA256SUMS", "data/models/*/*.keras"]
