name: mipyrna
channels:
  - conda-forge
  - bioconda

dependencies:
  - python>=3.10,<3.13
  - pip
  - setuptools>=68
  - wheel

  # Core scientific & reporting stack
  - numpy
  - pandas
  - scipy
  - matplotlib
  - seaborn
  - scikit-learn
  - openpyxl
  - requests
  - tqdm
  - psutil
  - reportlab
  - adjusttext

  # Bioinformatics & deep-learning dependencies
  - biopython
  - pyfaidx
  - pysam
  - htseq
  - bx-python
  - forgi
  - viennarna
  - keras
  - tensorflow

  # R differential expression stack
  - r-base
  - rpy2
  - bioconductor-deseq2
  - bioconductor-edger

  # External small RNA-seq tools
  - bowtie
  - blast
  - miranda
  - fastqc
  - trimmomatic
  - flexbar
  - trim-galore
