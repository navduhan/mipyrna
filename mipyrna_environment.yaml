name: mipyrna-0.2
channels:
  - conda-forge
  - bioconda
  - defaults
  - r

dependencies:
  - python=3.10
  - pip
  - setuptools
  - wheel

  # Core Python scientific stack
  - numpy
  - pandas
  - scipy
  - matplotlib
  - seaborn
  - statsmodels
  - scikit-learn
  - openpyxl
  - requests
  - tqdm
  - psutil
  - jinja2
  - tabulate
  - notebook

  # Bioinformatics Python dependencies used by miPyRNA
  - biopython
  - pyfaidx
  - pysam
  - htseq
  - bx-python
  - forgi
  - viennarna
  - adjusttext
  - keras
  - tensorflow

  # R / DE analysis
  - r-base
  - r-essentials
  - rpy2
  - bioconductor-deseq2
  - bioconductor-edger

  # External tools used in workflow
  - fastqc
  - flexbar
  - trimmomatic
  - trim-galore
  - sortmerna
  - star
  - hisat2
  - bowtie
  - bowtie2
  - subread
  - samtools
  - bamtools
  - bedtools
  - ncbi-blast+
  - mirdeep2
  - miranda
  - ucsc-fasomerecords
  - wget
