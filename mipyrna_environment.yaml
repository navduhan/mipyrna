name: mipyrna
channels:
  - conda-forge
  - bioconda
  - defaults
  - r

dependencies:
  - python=3.11
  - pip
  - setuptools
  - wheel

  # Core Python scientific stack
  - numpy=2.4.6
  - pandas
  - scipy
  - matplotlib
  - seaborn
  - statsmodels
  - scikit-learn
  - openpyxl
  - requests
  - tqdm
  - psutil
  - jinja2
  - tabulate
  - notebook

  # Bioinformatics Python dependencies used by miPyRNA
  - biopython
  - pyfaidx
  - pysam
  - htseq
  - bx-python
  - forgi=2.2.3
  - viennarna=2.7.2
  - adjusttext
  - keras=3.11.3
  - tensorflow=2.20.0

  # R / DE analysis
  - r-base
  - r-essentials
  - rpy2
  - bioconductor-deseq2
  - bioconductor-edger

  # External tools used in workflow
  - fastqc
  - flexbar
  - trimmomatic
  - trim-galore
  - sortmerna
  - star
  - hisat2
  - bowtie
  - bowtie2
  - subread
  - samtools
  - bamtools
  - bedtools
  - blast
  - mirdeep2
  - miranda
  - ucsc-fasomerecords
