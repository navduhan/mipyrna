## Bowtie Aligner config file for reads against miRNA hairpins
## Author: Naveen Duhan
## Type NA if you don't want to use any option
## You can add more option from a program with <key = option value #comment>

[index]
index_dir = bowtie_index  # this will created in results directory
basename = genome
threads = --threads 50
[alignment]
index_dir = bowtie_index
reference = genome 
cores = -p 20
output = --sam
report = --best
strata = --strata
all = -a
norc = --norc
hits = -v 1
